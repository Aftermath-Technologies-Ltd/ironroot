# Author: Bradley R. Kinnard
# mypy configuration. The integrity core is held to --strict; experimental
# subsystems are ignored as part of the Phase 0 ratchet. See
# upgrade-plan.md Phase 0.7 and EXPERIMENTAL.md.

[mypy]
python_version = 3.12
strict = True
warn_return_any = True
warn_unused_ignores = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_any_generics = True
no_implicit_optional = True
warn_redundant_casts = True
plugins = pydantic.mypy

[mypy-celery.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-dotenv]
ignore_missing_imports = True

# ------------------------------------------------------------------
# Experimental subsystem quarantine (Phase 0 ratchet).
# When a subsystem graduates in Phase 4, remove its prefix here and
# bring the code up to --strict.
# ------------------------------------------------------------------

[mypy-ironroot.agents.*]
ignore_errors = True

[mypy-ironroot.agi.*]
ignore_errors = True

[mypy-ironroot.battery.*]
ignore_errors = True

[mypy-ironroot.capabilities.*]
ignore_errors = True

[mypy-ironroot.cognition.planning.*]
ignore_errors = True

[mypy-ironroot.cognition.strategies.*]
ignore_errors = True

[mypy-ironroot.evolution.*]
ignore_errors = True

[mypy-ironroot.healing.*]
ignore_errors = True

[mypy-ironroot.orchestration.*]
ignore_errors = True

[mypy-ironroot.reality.*]
ignore_errors = True

[mypy-ironroot.research.*]
ignore_errors = True

[mypy-ironroot.ui_backend.*]
ignore_errors = True

[mypy-ironroot.world_models.*]
ignore_errors = True

[mypy-ironroot.llm.*]
ignore_errors = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
