# Author: Bradley R. Kinnard
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ironroot"
version = "0.1.0"
description = "Irreversible Research Ecology for Robust Agent Evolution"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Bradley R. Kinnard" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "httpx>=0.26.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    # Used by experimental subsystems (agi, research). Declared at top-level
    # so the package is collectible; gated by ironroot.experimental.* at
    # import sites in Phase 0.8.
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "httpx>=0.26.0",
    "hypothesis>=6.100.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
]

[project.scripts]
ironroot = "ironroot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ironroot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage threshold is the current floor; Phase 1+ adds integration coverage
# against real Postgres and the number is expected to climb. The upgrade-plan
# recommendation of 70 is the aspirational ratchet target — we move the floor
# up as more tests land, never down.
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src/ironroot",
    "--cov-report=term-missing",
    "--cov-fail-under=30",
]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
    "integrity: Phase 1 adversarial integrity tests",
]

[tool.coverage.run]
source = ["src/ironroot"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 30
show_missing = true

[tool.black]
line-length = 99
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | migrations
    | __pycache__
)/
'''

# mypy configuration lives in mypy.ini (kept separate so the
# per-module quarantine list stays readable). See mypy.ini and
# EXPERIMENTAL.md.

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
