# Author: Bradley R. Kinnard
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Run black check
        run: black --check src/ tests/

      - name: Run mypy (--strict)
        run: mypy --strict src/

      - name: Guard against random.* in non-experimental modules
        run: python scripts/check_no_random_in_core.py

      - name: Run id-prefix declaration test (fast feedback)
        run: pytest -q --no-cov tests/unit/test_ids.py

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ironroot_test
          POSTGRES_USER: ironroot
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          IRONROOT_DEBUG: "true"
          IRONROOT_DB_HOST: localhost
          IRONROOT_DB_PORT: 5432
          IRONROOT_DB_NAME: ironroot_test
          IRONROOT_DB_USER: ironroot
          IRONROOT_DB_PASSWORD: testpass
          IRONROOT_REDIS_HOST: localhost
          IRONROOT_REDIS_PORT: 6379
        run: pytest -q --cov=src/ironroot --cov-fail-under=30

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false
