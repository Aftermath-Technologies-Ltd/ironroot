# Author: Bradley R. Kinnard
# Alembic configuration for ironroot. The actual sqlalchemy.url is overridden
# at runtime by env.py from `ironroot.settings`; the placeholder below is only
# used if env.py is bypassed.

[alembic]
script_location = src/ironroot/storage/migrations
prepend_sys_path = .
sqlalchemy.url = postgresql://ironroot:changeme@localhost:5432/ironroot
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
