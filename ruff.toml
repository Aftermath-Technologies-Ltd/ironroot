# Author: Bradley R. Kinnard
line-length = 99
target-version = "py312"

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate commented-out code
    "PL",     # pylint
    "RUF",    # ruff-specific
    "DTZ",    # flake8-datetimez (forbid datetime.utcnow / naive datetimes)
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
    "ARG001",   # unused function arguments (placeholder code)
    "ARG002",   # unused method arguments (placeholder code)
    "PLW0603",  # global statement (singletons)
    "PLC0415",  # import not at top level (lazy imports)
    "B008",     # function call in default args (fastapi Depends pattern)
]

[lint.isort]
known-first-party = ["ironroot"]
force-single-line = false
combine-as-imports = true

[lint.per-file-ignores]
"tests/*" = [
    "ARG",
    "PLR2004",
    "E501",
    "PLR0912",
    "PLR0915",
    "F841",
    "B007",
    "RUF012",
    "PLW1510",
    "PLR1714",
    "C401",
    "B905",
    "C416",
    "PLR0911",
    "PTH103",
    "PTH118",
    "PTH120",
    "PTH123",
    "RUF015",
    "RUF005",
    "SIM102",
    "SIM108",
    "F401",
    "TC001",
    "TC002",
    "TC003",
    "RUF007",
    "RUF059",
]
# Phase 0 ratchet: experimental modules are quarantined; the relevant rule
# codes are suppressed here while the corresponding subsystems remain in
# `ironroot.experimental.*` (see EXPERIMENTAL.md). When a subsystem is
# promoted in Phase 4, its prefix must be removed from this list and the
# code brought up to the full ruleset.
